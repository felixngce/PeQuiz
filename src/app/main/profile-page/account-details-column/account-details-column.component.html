<div class="home-profile-modal" tabindex="-1" role="dialog" *ngIf="isDataLoaded">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5>
          Account Details:
        </h5>

      </div>
      <div class="modal-body">
        <div>
          <p>Quizzes created: <span style="float: right;padding-right: 7%">{{user_data[0].quiz_created.length}}</span>
          </p>

          <hr>
        </div>
        <div>
          <p>Number of Friends: <span style="float: right;padding-right: 7%">{{user_data[0].friends.length}}</span> </p>
          <hr>
        </div>
        <div>
          <p style="font-size: 13px;">Password Changed: <span style="float: right;padding-right: 7%">{{pw_date}}</span> </p>
          <hr>
        </div>

        <div>
          <p>Created: <span style="float: right;padding-right: 7%">{{latest_date}}</span> </p>
          <hr>
        </div>
      </div>

    </div>
    <div>

    </div>
  </div>
</div>
